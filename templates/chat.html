<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nova Chat</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: #1a1a1a;
      font-family: 'Courier New', monospace;
    }
    #chatbox {
      height: 400px;
      overflow-y: auto;
    }
    .user-message {
      text-align: right;
    }
    .nova-message {
      text-align: left;
    }
  </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen text-white p-4">
  <h1 class="text-4xl font-bold mb-4 text-green-400">Nova Chat</h1>
  
  <div id="chatbox" class="w-full max-w-xl border-2 border-green-400 p-4 mb-4 rounded bg-black"></div>
  
  <div class="flex w-full max-w-xl">
    <input id="user-input" type="text" placeholder="Type a message..." class="flex-1 p-2 rounded-l border-2 border-green-400 bg-black text-white outline-none"/>
    <button onclick="sendMessage()" class="bg-green-400 text-black px-4 rounded-r font-bold">Send</button>
  </div>

  <script>
    const chatbox = document.getElementById("chatbox");
    const userInput = document.getElementById("user-input");

    function appendMessage(sender, text) {
      const div = document.createElement("div");
      div.textContent = text;
      if(sender === "You") {
        div.className = "user-message text-blue-400 my-1";
      } else {
        div.className = "nova-message text-green-400 my-1";
      }
      chatbox.appendChild(div);
      chatbox.scrollTop = chatbox.scrollHeight;
    }

    function sendMessage() {
      const message = userInput.value.trim();
      if(!message) return;
      appendMessage("You", message);
      userInput.value = "";

      fetch("/get_response", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({message})
      })
      .then(res => res.json())
      .then(data => appendMessage("Nova", data.response));
    }

    userInput.addEventListener("keypress", e => {
      if(e.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
