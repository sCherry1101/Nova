<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="starlogo.png"> 
    <link rel="stylesheet" href="profile.css">
    <title>Profile</title>
</head>
<body>
    <div id="loader">
  <div class="loading-text">LOADING...</div>
</div>
 
    <h3>Build Your Identity</h3>
    <div class="profile">
        <div id="username">
             <form action="#" method="post" class="profile-form">
             <label for="username">Username:</label>
             <input type="text" id="username" name="username" required>
        </div>
        <div id="avatar">
             <label for="avatar">Choose an Avatar:</label>
             <select id="avatar" name="avatar" required>
                 <option value="">Select an avatar</option>
                 <option value="warrior">Warrior</option>
                 <option value="mage">Hunter</option>
                 <option value="archer">Archer</option>
                 <option value="healer">Healer</option>
                <option value="knight">Knight</option>
            </select>
        </div>
        <div id="bio">
             <label for="bio">Short Bio:</label>
             <textarea id="bio" name="bio" rows="4" placeholder="Tell us a bit about yourself..." required></textarea>
        </div>
        <div id="submit">
             <button type="submit" class="button">Save Profile</button>
        </div>
    </div>
    <script>
  window.addEventListener("load", () => {
    const loader = document.getElementById("loader");
    setTimeout(() => {
      loader.style.display = "none";
    }, 1200); 
  });
</script>

</body>
</html>
