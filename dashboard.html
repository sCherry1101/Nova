<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NOVA | Dashboard</title>
  <link rel="stylesheet" href="dashboard.css" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
</head>
<body>
  <!-- Loader -->
  <div id="loader">
    <div class="loading-text">LOADING...</div>
  </div>

  <header class="dashboard-header">
    <h1 class="logo">★ NOVA DASHBOARD ★</h1>
  </header>

  <main class="dashboard-main">
    <!-- Player Stats -->
    <section id="stats">
      <h2>PLAYER STATS</h2>
      <div class="stat-boxes">
        <div class="stat">Level: <span id="level">1</span></div>
        <div class="stat">XP: <span id="xp">0</span> / <span id="xp-max">100</span></div>
        <div class="stat">Energy: <span id="energy">100</span>%</div>
      </div>
      <div class="xp-bar"><div id="xp-fill"></div></div>
      <div id="level-up-text">LEVEL UP!</div>
    </section>

    <!-- Tasks (User-created) -->
    <section id="tasks">
      <h2>MISSIONS</h2>
      <div class="task-input">
        <input type="text" id="task-input" placeholder="Enter a new mission..." />
        <input type="number" id="task-xp" placeholder="XP" min="1" max="100" />
        <button id="add-task">ADD</button>
      </div>
      <ul class="mission-list" id="mission-list"></ul>
    </section>

   
    <section id="timer">
      <h2>TIMER</h2>
      <div id="display">00:00:00</div>
      <div class="timer-inputs">
        <input type="number" id="custom-minutes" placeholder="Minutes" min="0" />
        <input type="number" id="custom-seconds" placeholder="Seconds" min="0" max="59" />
      </div>
      <button id="start">Start</button>
      <button id="pause">Pause</button>
      <button id="stop">Stop</button>
    </section>

    
    <section id="calculator">
      <h2>CALCULATOR</h2>
      <input type="text" id="calc-display" readonly />
      <div class="calc-buttons">
        <button class="calc-btn">7</button><button class="calc-btn">8</button><button class="calc-btn">9</button><button class="calc-btn">/</button>
        <button class="calc-btn">4</button><button class="calc-btn">5</button><button class="calc-btn">6</button><button class="calc-btn">*</button>
        <button class="calc-btn">1</button><button class="calc-btn">2</button><button class="calc-btn">3</button><button class="calc-btn">-</button>
        <button class="calc-btn">0</button><button class="calc-btn">.</button><button id="calc-clear">C</button><button class="calc-btn">+</button>
        <button id="calc-equal">=</button>
      </div>
    </section>

    
    <section id="notepad">
      <h2>NOTEPAD</h2>
      <textarea id="note-area" placeholder="Write something..."></textarea>
      <button id="save-note">Save</button>
      <button id="clear-note">Clear</button>
    </section>

   
    <section id="chatbot">
      <h2>NOVA CHATBOT</h2>
    </section>

  </main>

  <footer class="dashboard-footer">
    <p>© 2025 NOVA. Level up your reality 🌌</p>
  </footer>

  <script src="dashboard.js"></script>
</body>
</html>
